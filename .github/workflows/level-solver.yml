name: BlockFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check difficulty.js
          node --check state-core.js
          node --check runtime-core.js
      - name: Validate app shell
        run: node tools/validate-app.mjs
      - name: Run state regression tests
        run: node tools/test-app-state.mjs
      - name: Run runtime clock regression tests
        run: node tools/test-runtime-core.mjs
      - name: Validate level structure
        run: node tools/validate-levels.mjs
      - name: Solve every level and boss phase
        run: node tools/solve-levels.mjs --json solver-results-ci.json --strict
      - name: Upload solver report
        uses: actions/upload-artifact@v7
        with:
          name: blockflow-solver-results
          path: solver-results-ci.json
