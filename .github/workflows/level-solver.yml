name: Level Solver

on:
  push:
    branches: [main]
    paths:
      - "levels.js"
      - "tools/solve-levels.mjs"
      - "tools/validate-levels.mjs"
      - ".github/workflows/level-solver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate level structure
        run: node tools/validate-levels.mjs
      - name: Solve every level
        run: node tools/solve-levels.mjs --json solver-results-ci.json --strict
      - name: Upload solver report
        uses: actions/upload-artifact@v4
        with:
          name: blockflow-solver-results
          path: solver-results-ci.json
