<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><meta name="theme-color" content="#0f172a"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="Block Flow"/><title>Block Flow</title><link rel="manifest" href="manifest.webmanifest"/><link rel="stylesheet" href="styles.css"/></head>
<body><main class="app-shell"><header class="topbar"><div><div class="eyebrow">BLOCK FLOW</div><h1 id="levelTitle">Level 1</h1><div class="difficulty-badge" id="difficultyBadge">Easy</div></div><div class="top-actions"><button class="icon-btn" id="accessibilityBtn" aria-label="Toggle colorblind patterns">◩</button><button class="icon-btn" id="soundBtn" aria-label="Toggle sound">♪</button></div></header>
<section class="difficulty-wrap"><div class="section-label">CHALLENGE</div><div class="difficulty-row" aria-label="Puzzle difficulty"><button class="difficulty-chip active" data-difficulty="easy">Easy</button><button class="difficulty-chip" data-difficulty="intermediate">Intermediate</button><button class="difficulty-chip" data-difficulty="hard">Hard</button><button class="difficulty-chip extreme" data-difficulty="extreme">Extreme ☠️</button></div></section>
<div class="section-label pressure-label">PRESSURE</div><section class="mode-row" aria-label="Game mode"><button class="mode-chip active" data-mode="chill">Chill</button><button class="mode-chip" data-mode="classic">Classic</button><button class="mode-chip" data-mode="rush">Rush</button></section>
<section class="stats-card"><div class="stat"><span>Moves</span><strong id="moveCount">0</strong></div><div class="stat"><span>Par</span><strong id="parCount">0</strong></div><div class="stat"><span>Time</span><strong id="timerDisplay">∞</strong></div></section>
<section class="game-wrap"><div class="board-frame" id="boardFrame"><div class="board" id="board" role="application" aria-label="Block Flow puzzle board"></div></div><p class="hint" id="levelHint"></p></section><section class="controls"><button class="secondary" id="undoBtn">↶ Undo</button><button class="secondary" id="resetBtn">↻ Restart</button></section><section class="progress-wrap"><div class="progress-header"><span id="journeyLabel">Easy Journey</span><span id="progressText">1 / 3</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></section></main>
<div class="modal-backdrop hidden" id="winModal" role="dialog" aria-modal="true" aria-labelledby="winTitle"><div class="modal-card"><div class="win-badge">FLOW CLEARED</div><h2 id="winTitle">Nice work.</h2><div class="stars" id="stars">★★★</div><p id="winSummary"></p><div class="comparison"><div><span>Your moves</span><strong id="yourMoves">0</strong></div><div><span>Perfect</span><strong id="perfectMoves">0</strong></div></div><button class="primary" id="nextBtn">Next Level</button><button class="text-btn" id="replayBtn">Replay for Perfect</button></div></div><div class="modal-backdrop hidden" id="failModal" role="dialog" aria-modal="true" aria-labelledby="failTitle"><div class="modal-card"><div class="win-badge danger">TIME</div><h2 id="failTitle">So close.</h2><p>No lives. No waiting. Just run it back.</p><button class="primary" id="retryBtn">Retry instantly</button><button class="text-btn" id="switchChillBtn">Switch to Chill</button></div></div>
<script src="levels.js"></script><script src="difficulty.js"></script><script src="app.js"></script></body></html>
